<!DOCTYPE html>
<html lang="ko">

<head>

        </div>

        <nav class="nav-links">
            <a href="#" class="nav-item active">
                <i data-lucide="home"></i>

            </a>
            <div class="nav-item-container">
                <a href="#" class="nav-item">
                    <i data-lucide="layout-grid"></i>
                    Explore
                </a>
                <div class="dropdown-menu">
                    <a href="austria.html">

        <div class="header-right">

                </h2>

                <svg class="hand-drawn-line" viewBox="0 0 150 10" preserveAspectRatio="none">
                    <path
                        d="M2,5 C15,2 30,8 45,5 C60,2 75,8 90,5 C105,2 120,8 135,5 C145,2 148,5 148,5 L148,6 C148,6 145,8 135,7 C120,9 105,4 90,7 C75,9 60,4 45,7 C30,9 15,4 2,6 Z"

                <svg class="curly-arrow" viewBox="0 0 120 80" preserveAspectRatio="none" style="overflow: visible;">

                    <path d="M108,12 L120,10 L115,22" stroke="#7C5DB3" stroke-width="2.7" fill="none"

        <section class="map-section">
            <div id="map-container"></div>

    <script>
        // Initialize Lucide icons
        lucide.createIcons();
